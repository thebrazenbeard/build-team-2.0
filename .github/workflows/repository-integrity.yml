name: repository-integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate repository structure and registry
        run: python scripts/validate_repository.py
      - name: Protocol V2 governance overlay regressions
        run: python -m unittest discover -s tests -v
      - name: Four checkpoint regressions
        run: python -m pytest -q continuity/four/test_checkpoint_tool.py continuity/four/v1.0.1/test_checkpoint_tool.py
      - name: Five checkpoint regressions
        run: python continuity/five/test_checkpoint_tool.py
      - name: Six checkpoint regressions
        run: python continuity/six/test_checkpoint_tool.py
      - name: Thirteen checkpoint regressions
        working-directory: continuity/thirteen
        run: python test_checkpoint_tool.py
      - name: Four v1.0.1 package validator
        run: python training/roles/four/1.0.1/validate_package.py
      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
