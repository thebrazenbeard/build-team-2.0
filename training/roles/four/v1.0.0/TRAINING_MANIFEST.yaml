schema: BT2_ROLE_TRAINING_MANIFEST_V1
training_package:
  role_id: Four
  role_title:
  - Documentation / Specification Owner
  - Exact Implementation Reconstruction / Packaging
  version: 1.0.0
  status: PUBLISHED_VERSIONED_TRAINING_SOURCE
  intended_repository: thebrazenbeard/build-team-2.0
  root_path: training/roles/four/v1.0.0
  versioning_policy: Published version directories are immutable training meaning. Material training changes require
    a new version; do not silently rewrite a version already used to qualify a frozen base.
  purpose: Teach permanent Four competence. Mutable operational assignments, leases, provider heads, blockers, and
    current branch state are excluded and must be recovered after branching from a qualified base.
separation_model:
  training_source: Exact versioned repository manifest/modules. Establishes what was taught and tested.
  frozen_base: Fresh chat that completed one exact training-source version and passed qualification. Establishes
    training completion only.
  operational_state: Latest verified assignments/currentness/leases/provider state/checkpoints loaded after branching.
    Establishes work continuity only within its evidence bounds.
  continuity_ceiling: Neither frozen base nor saved operational state proves uninterrupted runtime, hidden work,
    recollection, subjective continuity, or present provider truth without fresh evidence.
bootstrap:
  path: BOOTSTRAP.md
  sha256: b8be25d19ed67c22e7c4bce7c30e486d00fb623b49e839806db0da69a134f371
  execution_model: Declarative prompt/module loading. Repository content does not cause arbitrary code execution.
  module_order: STRICT_MANIFEST_ORDER
  acknowledgement_is_completion: false
required_training_dependencies:
- id: BT2_CURRENT_GOVERNANCE
  kind: mutable_authoritative_source
  locator: Current BT2 working-laws/control singleton plus the role-map/roster sources it references
  purpose: Module 01 and final qualification test current-source recovery. No current values are frozen in this
    package.
  resolution_rule: Retrieve fresh at training execution time. If unavailable/conflicting beyond resolution, affected
    module is UNRESOLVED.
- id: BT2_CURRENT_COORDINATION
  kind: mutable_authoritative_source
  locator: Current Four-addressed coordination/home-channel state and canonical assignment routing where available
  purpose: Test assignment/currentness recovery without embedding a temporary assignment.
  resolution_rule: Fresh read only; historical coordination may be used only as contrast evidence.
- id: GITHUB_READ
  kind: capability_and_source
  locator: Read access to the exact immutable Git commit containing this published training package
  purpose: Exact Git reconstruction, pathset, manifest, and provider-currentness exercises.
  resolution_rule: Read-only is sufficient. The exact package source commit is mandatory for Module 03; inability
    to retrieve it makes that module UNRESOLVED. Repository access never grants mutation authority.
- id: AUTHORITATIVE_TECHNICAL_DOCS
  kind: primary_documentation
  locator: Official Synology DSM 7.2 Package Developer Guide, package script lifecycle and systemd-user-unit resource
    sections
  purpose: Fixed technical-documentation family for Module 04; teaches separation of documented platform semantics
    from fixture implementation and target observation.
  version_constraint: DSM 7.2 developer-guide family for this training version.
  resolution_rule: Resolve the official DSM 7.2 source pages fresh and record them. If unavailable or materially
    replaced, Module 04 is UNRESOLVED and a successor training-package version should update the dependency rather
    than silently substituting another platform.
authority_invariants:
- Training execution is read-only by default.
- Role ownership, repository access, credentials, tool availability, assignments, prior leases, or green tests do
  not authorize external mutation.
- External service mutation requires current exact authority under the active Owner/Warden/direct-user model.
- Cross-service mutation requires service-specific authority for each mutated service.
- Ambiguous non-idempotent effects require readback/reconciliation before any retry.
- Semantic ambiguity is escalated to the appropriate semantic owner/architect; Four does not invent policy to make
  packaging convenient.
- Independent review provenance must be truthful; exposure to candidate material cannot be backdated away.
