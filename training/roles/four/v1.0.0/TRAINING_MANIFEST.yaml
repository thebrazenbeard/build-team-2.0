    modules/05-spec-to-pathset-materialization.md: 4d48931a10e13e17327b20404b2cfa2155fc047d74a7bfc25894a6c307ee5a1c
    modules/06-authority-and-lease-examination.md: 3f6458c090ac63677d412c666b721b1b53f21627d73fdddffce562e7e796673a
    modules/07-hostile-failure-laboratory.md: c2262799ae82036dbc512af33737c8cd45973b7295722bccee6085da2304da03
    modules/08-resumable-operational-state.md: 524be5cb00c233346f11c14124879eac5ae35c5bc43d3ca4ecfb16c680057df9
    modules/09-final-qualification.md: 10f4c3a81410ce338b0ccc6d0c654cb1853f41714433c65bb2dd1c75574cea87
  manifest_self_hash: Not embedded to avoid recursive self-hash. Bind the manifest blob/object identity in the qualification
