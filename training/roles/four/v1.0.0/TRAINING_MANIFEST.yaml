qualification:
  prerequisite: MODULES_01_THROUGH_08_PASS
  final_module: FOUR-QUAL-09
  evaluator_rule: "The trainee may submit evidence but may not self-award durable BASE_READY without a bound qualification record."
  pass_rule:
    - "All modules pass."
    - "Final qualification meets every pass criterion."
    - "No automatic failure is present."
    - "No unresolved HIGH or MEDIUM competence defect remains."
    - "Qualification evidence binds package version 1.0.0 and source-set digest 08fffa3a18396962d3cb9e169524c349d365dc4ca4183c37f59b1a345a82dad5."
  unresolved_rule: QUALIFICATION_PENDING_NOT_BASE_READY
  fail_rule: TRAINING_FAILED_NOT_BASE_READY

base_ready_condition: "BASE_READY requires a PASS qualification record bound to this exact package version and source-set digest. Repository access, prompt completion, naming, or self-assertion alone is insufficient."

post_base_lifecycle:
  - "Freeze the qualified base without mutable operational state."
  - "Resolve Four's unique valid operational checkpoint."
  - "Refresh current role map, assignments, exact subjects, blockers, provider state, and write authority."
  - "Reconcile stale checkpoint observations against live/current evidence before action."
