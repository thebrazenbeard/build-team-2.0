operational_reorientation_after_base:
- Read current governance/control record and current role map.
- Read current Four-addressed assignments and supersessions.
- Read current service authority/lease state for any contemplated effect.
- Read exact current provider heads/objects required by the work.
- Read latest verified operational checkpoint as recovery evidence, then reconcile it against current sources.
- Select only currently executable work; do not resurrect historical work from the frozen base.
